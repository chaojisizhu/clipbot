[package]
name = "clipbot"
version = "0.2.10"
edition = "2024"
description = "Rust 原站视频图集解析与 QQ 官方机器人"
license = "MIT"

[dependencies]
anyhow = "1"
bytes = "1"
base64 = "0.22"
html-escape = "0.2"
cookie = "0.18"
qrcode = { version = "0.14", default-features = false }
png = "0.18"
imagesize = { version = "0.15", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
kamadak-exif = "0.6"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
hex = "0.4"
md5 = "0.7"
once_cell = "1"
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "rustls-tls", "gzip", "brotli", "cookies"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
sha1 = "0.10"
sha2 = "0.10"
thiserror = "2"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "fs", "io-util", "process", "signal"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
urlencoding = "2"

[dev-dependencies]
axum = { version = "0.8", features = ["ws"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

